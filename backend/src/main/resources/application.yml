spring:
  application:
    name: pettale-backend
  datasource:
    url: ${PETTALE_DB_URL:jdbc:postgresql://localhost:5432/pettale}
    username: ${PETTALE_DB_USERNAME:pettale}
    password: ${PETTALE_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
pettale:
  apple:
    issuer: ${PETTALE_APPLE_ISSUER:https://appleid.apple.com}
    audience: ${PETTALE_APPLE_AUDIENCE:com.pettale.app}
    jwk-set-uri: ${PETTALE_APPLE_JWK_SET_URI:https://appleid.apple.com/auth/keys}
  session:
    issuer: ${PETTALE_SESSION_ISSUER:pettale-backend}
    lifetime: ${PETTALE_SESSION_LIFETIME:P30D}
    signing-key: ${PETTALE_SESSION_SIGNING_KEY:}
  ai:
    monthly-request-limit: ${PETTALE_AI_MONTHLY_REQUEST_LIMIT:25}
    extraction-model: ${PETTALE_EXTRACTION_MODEL:gpt-5-mini}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
